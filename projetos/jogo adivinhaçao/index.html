<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🎯 Jogo de Adivinhação</h1>

    <p>Tente adivinhar o número entre 1 e 100</p>

    <input type="number" id="palpite" placeholder="Digite um número">

    <div class="botoes">
      <button id="btnChutar">Chutar</button>
      <button id="btnReset">Reiniciar</button>
    </div>

    <p id="mensagem"></p>
    <p id="tentativas"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
